[workspace]
resolver = "2"
members = [
    "crates/mq-common",
    "crates/mq-protocol",
    "crates/mq-store",
    "crates/mq-txn",
    "crates/mq-namesrv",
    "crates/mq-broker",
    "crates/mq-observability",
    "crates/mq-client",
    "crates/mq-tc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
crc32c = "0.6"
crc32fast = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio-rustls = "0.26"
rustls-pemfile = "2"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
