# MQ-rust only container stack (Docker desktop / Linux Docker)
# docker compose -f deploy/docker-compose.lite.yml up -d
services:
  mq-rust-namesrv:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-namesrv"]
    command:
      - --listen
      - 0.0.0.0:9877
      - --cluster
      - DefaultCluster
      - --broker-name
      - broker-a
      - --broker-addr
      - 127.0.0.1:10921
      - --queues
      - "8"
    ports:
      - "9877:9877"
    networks: [mqnet]

  mq-rust-broker:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-broker"]
    command:
      - --listen
      - 0.0.0.0:10921
      - --namesrv
      - mq-rust-namesrv:9877
      - --queues
      - "8"
      - --metrics-listen
      - 0.0.0.0:9090
      - --admin-listen
      - 0.0.0.0:9091
      - --tc-url
      - http://mq-rust-tc-1:9191,http://mq-rust-tc-2:9191,http://mq-rust-tc-3:9191
      - --store-root
      - /data/broker
      - --audit-path
      - /data/audit.log
      - --tc-outbox-path
      - /data/tc-outbox.log
    depends_on: [mq-rust-namesrv, mq-rust-tc-1, mq-rust-tc-2, mq-rust-tc-3]
    ports:
      - "10921:10921"
      - "9090:9090"
      - "9192:9091"
    volumes:
      - mqdata:/data
    networks: [mqnet]

  mq-rust-tc-1:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    command: ["--id", "1", "--raft-listen", "0.0.0.0:19301", "--api-listen", "0.0.0.0:9191", "--peers", "1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301", "--data-dir", "/data/tc"]
    ports: ["19401:9191"]
    volumes: [tcdata1:/data/tc]
    networks: [mqnet]

  mq-rust-tc-2:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    command: ["--id", "2", "--raft-listen", "0.0.0.0:19301", "--api-listen", "0.0.0.0:9191", "--peers", "1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301", "--data-dir", "/data/tc"]
    ports: ["19402:9191"]
    volumes: [tcdata2:/data/tc]
    networks: [mqnet]

  mq-rust-tc-3:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    command: ["--id", "3", "--raft-listen", "0.0.0.0:19301", "--api-listen", "0.0.0.0:9191", "--peers", "1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301", "--data-dir", "/data/tc"]
    ports: ["19403:9191"]
    volumes: [tcdata3:/data/tc]
    networks: [mqnet]

networks:
  mqnet:
    driver: bridge

volumes:
  mqdata:
  tcdata1:
  tcdata2:
  tcdata3:
