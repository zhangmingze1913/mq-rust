# MQ-rust + RocketMQ + Prometheus + Grafana 本地栈
# 用法（需 Docker Desktop / Linux Docker）：
#   docker compose -f deploy/docker-compose.yml up -d --build
# 说明：MQ-rust 容器与原生 RocketMQ 容器并行，端口已错开。
services:
  namesrv:
    image: apache/rocketmq:5.3.4
    command: sh mqnamesrv
    ports:
      - "9876:9876"
    networks: [mqnet]

  rocketmq-broker:
    image: apache/rocketmq:5.3.4
    command: sh mqbroker -n namesrv:9876 -c /home/rocketmq/conf/broker.conf
    depends_on: [namesrv]
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m"
    ports:
      - "10911:10911"
      - "10909:10909"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    networks: [mqnet]

  mq-rust-namesrv:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-namesrv"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - --listen
      - 0.0.0.0:9877
      - --cluster
      - DefaultCluster
      - --broker-name
      - broker-a
      - --broker-addr
      - 127.0.0.1:10921
      - --queues
      - "8"
    ports:
      - "9877:9877"
    networks: [mqnet]

  mq-rust-broker:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-broker"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - --listen
      - 0.0.0.0:10921
      - --namesrv
      - mq-rust-namesrv:9877
      - --queues
      - "8"
      - --metrics-listen
      - 0.0.0.0:9090
      - --admin-listen
      - 0.0.0.0:9091
      - --tc-url
      - http://mq-rust-tc-1:9191,http://mq-rust-tc-2:9191,http://mq-rust-tc-3:9191
      - --store-root
      - /data/broker
      - --audit-path
      - /data/audit.log
      - --tc-outbox-path
      - /data/tc-outbox.log
    depends_on: [mq-rust-namesrv, mq-rust-tc-1, mq-rust-tc-2, mq-rust-tc-3]
    ports:
      - "10921:10921"
      - "9090:9090"
      - "9192:9091"
    volumes:
      - mqdata:/data
    networks: [mqnet]

  mq-rust-tc-1:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - /usr/local/bin/mq-tc
      - --id
      - "1"
      - --raft-listen
      - 0.0.0.0:19301
      - --api-listen
      - 0.0.0.0:9191
      - --peers
      - 1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301
      - --data-dir
      - /data/tc
    ports:
      - "19401:9191"
    volumes:
      - tcdata1:/data/tc
    networks: [mqnet]

  mq-rust-tc-2:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - /usr/local/bin/mq-tc
      - --id
      - "2"
      - --raft-listen
      - 0.0.0.0:19301
      - --api-listen
      - 0.0.0.0:9191
      - --peers
      - 1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301
      - --data-dir
      - /data/tc
    ports:
      - "19402:9191"
    volumes:
      - tcdata2:/data/tc
    networks: [mqnet]

  mq-rust-tc-3:
    image: mq-rust:0.9.0-rc.1
    entrypoint: ["/usr/local/bin/mq-tc"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command:
      - /usr/local/bin/mq-tc
      - --id
      - "3"
      - --raft-listen
      - 0.0.0.0:19301
      - --api-listen
      - 0.0.0.0:9191
      - --peers
      - 1@mq-rust-tc-1:19301,2@mq-rust-tc-2:19301,3@mq-rust-tc-3:19301
      - --data-dir
      - /data/tc
    ports:
      - "19403:9191"
    volumes:
      - tcdata3:/data/tc
    networks: [mqnet]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9092:9090"
    networks: [mqnet]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    depends_on: [prometheus]
    networks: [mqnet]

networks:
  mqnet:
    driver: bridge

volumes:
  mqdata:
  tcdata1:
  tcdata2:
  tcdata3:
