# Static PVs for kind/local clusters without a dynamic provisioner.
# Apply only when the default StorageClass cannot bind; not for production.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mq-rust-tc-pv-0
spec:
  capacity:
    storage: 1Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard
  hostPath:
    path: /tmp/mq-rust-tc-0
    type: DirectoryOrCreate
  claimRef:
    namespace: mq-rust
    name: data-mq-rust-tc-0
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mq-rust-tc-pv-1
